<!DOCTYPE html>
<!--
  ============================================================
  소울푸드 리뉴얼 시안 : 상품 상세 페이지
    product.html?no=617  → 617번 상품
  ============================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 상세 | 소울푸드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="common.css">

  <style>
    /* 1. 위쪽: 사진(왼쪽) + 구매 정보(오른쪽) */
    .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 20px; }
    .photo { aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; background: var(--bg); position: relative; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 120px; opacity: .5; }

    .buy .market-link { font-size: 13px; color: var(--text-sub); font-weight: 600; }
    .buy h1 { font-size: 24px; line-height: 1.4; font-weight: 700; margin: 6px 0 10px; letter-spacing: -.5px; }
    .buy .tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .buy .desc { font-size: 13px; color: var(--text-sub); margin-top: 10px; }

    /* 판매 상태 안내 (재고확보중 · 품절 · 판매중지) */
    .state-note { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #EEF3FB; color: #2E5AA0; }
    .state-note.soldout, .state-note.stop { background: var(--bg); color: var(--text); }
    .price-box { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 0; margin: 18px 0; }
    .price-box .now { font-size: 30px; font-weight: 800; }
    .price-box .now small { font-size: 16px; }
    .price-box .rate { color: var(--brand); margin-right: 8px; font-style: normal; }
    .price-box del { color: #B5B5B5; font-size: 15px; margin-left: 8px; }
    .price-box .unit { color: var(--text-sub); font-size: 13px; margin-top: 4px; }

    .rows { font-size: 14px; margin-top: 16px; }
    .rows div { display: grid; grid-template-columns: 90px 1fr; padding: 6px 0; }
    .rows dt { color: var(--text-sub); }

    .order-box { background: var(--bg); border-radius: 12px; padding: 16px; margin-top: 18px; display: flex; justify-content: space-between; align-items: center; }
    .order-box .sum { text-align: right; }
    .order-box .sum small { color: var(--text-sub); font-size: 13px; }
    .order-box .sum b { font-size: 22px; color: var(--brand); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
    .actions .btn { text-align: center; }
    .actions .mail { grid-column: 1 / -1; }
    .barcode { margin-top: 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; display: flex; justify-content: center; }
    .barcode-svg { width: 220px; height: auto; display: block; }
    .barcode-num { font-family: monospace; font-size: 18px; letter-spacing: 2px; }
    .detail-text { white-space: pre-line; color: #444; }
    .detail-imgs { margin-top: 28px; }
    .detail-imgs img { display: block; width: 100%; max-width: 860px; margin: 0 auto; }   /* 상세 사진은 이어 붙여서 한 장처럼 */
    @media (max-width: 480px) { .actions { grid-template-columns: 1fr; } }

    /* 상품 페이지에서는 마우스를 올려도 모양이 바뀌지 않게 (버튼 · 링크 · 아래 다른 상품 카드) */
    #page .btn:hover { border-color: var(--line); }
    #page .btn-primary:hover { background: var(--brand); border-color: var(--brand); }
    #page .actions span.btn { cursor: default; }   /* 전화번호는 안내용 (누르는 링크 아님) */
    #page .breadcrumb a:hover, #page .section-head a:hover { color: inherit; }
    #page .card:hover .thumb img { transform: none; }
    #page .card .info:hover .name { text-decoration: none; }

    /* 배송 · 교환 · 반품 안내 표 */
    .policy { margin-top: 56px; padding-top: 32px; border-top: 2px solid var(--text); }
    .policy-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .policy h4 { font-size: 16px; font-weight: 700; margin: 28px 0 10px; }
    .policy-note { font-size: 14px; color: var(--text-sub); margin-bottom: 10px; }
    .policy-table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--line); font-size: 14px; word-break: keep-all; }
    .policy-list { word-break: keep-all; }
    .policy-table th { width: 170px; background: #F7F7F7; color: var(--text-sub); font-weight: 500; text-align: left; vertical-align: top; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .policy-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); color: #333; white-space: pre-line; line-height: 1.7; }
    .policy-list { font-size: 14px; color: #333; line-height: 1.8; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 16px 14px 34px; list-style: disc; }
    @media (max-width: 768px) {
      .policy-table th { width: 96px; padding: 12px 10px; }
      .policy-table td { padding: 12px 10px; }
    }

    /* 2. 아래쪽 탭 */
    .inquiry-note { margin-top: 12px; font-size: 13px; color: var(--text-sub); }
    .tabs { display: flex; border-bottom: 2px solid var(--text); margin-top: 64px; position: sticky; top: 52px; background: var(--white); z-index: 5; }
    .tabs button { flex: 1; height: 52px; font-size: 15px; font-weight: 600; color: var(--text-sub); }
    .tabs button.on { color: var(--white); background: var(--text); }
    .tab-panel { display: none; padding: 32px 0; font-size: 15px; }
    .tab-panel.on { display: block; }
    .tab-panel h4 { font-size: 17px; margin: 20px 0 8px; }
    .tab-panel h4:first-child { margin-top: 0; }
    .tab-panel p, .tab-panel li { color: #444; }
    .tab-panel ul { list-style: disc; padding-left: 20px; }
    .detail-img { background: var(--bg); border-radius: 12px; padding: 60px 20px; text-align: center; color: var(--text-sub); margin-top: 20px; }

    @media (max-width: 768px) {
      .detail { grid-template-columns: 1fr; gap: 20px; }
      .buy h1 { font-size: 20px; }
      .tabs { top: 52px; }
      .tabs button { font-size: 13px; }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="inner" id="page"></main>

  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    // 배송 · 교환 · 반품 안내 표 (모든 상품 공통, 관리자 '마켓 · 사이트 설정'에서 수정)
    function policyHTML() {
      if (!POLICY || POLICY.show === false || !(POLICY.sections || []).length) return '';
      return '<section class="policy"><h3 class="policy-title">' + esc(POLICY.title || '배송 · 교환 · 반품 안내') + '</h3>' +
        POLICY.sections.map(function (sec) {
          const rows = (sec.rows || []).filter(function (r) { return r && (r.label || r.text); });
          const bullets = (sec.bullets || []).filter(Boolean);
          return '<h4>' + esc(sec.title || '') + '</h4>' +
            (sec.note ? '<p class="policy-note">' + esc(sec.note) + '</p>' : '') +
            (rows.length ? '<table class="policy-table">' + rows.map(function (r) {
              return '<tr><th>' + esc(r.label || '') + '</th><td>' + esc(r.text || '') + '</td></tr>';
            }).join('') + '</table>' : '') +
            (bullets.length ? '<ul class="policy-list">' + bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>' : '');
        }).join('') + '</section>';
    }

    onData(function () {
      // 메뉴 밑줄: 이 상품이 속한 마켓
      const g = findGoods(new URLSearchParams(location.search).get('no'));
      if (g) document.body.dataset.current = g.market;
      renderHeader();   // 메뉴 밑줄(data-current)을 반영해서 헤더 다시 그리기

      const page = document.getElementById('page');

      // ---------------------------------------------------------
      // 상품이 없을 때
      // ---------------------------------------------------------
      if (!g) {
        page.innerHTML = '<div class="empty"><div class="big">🤔</div><p>찾으시는 상품이 없어요.</p><a class="btn btn-primary" href="index.html">메인으로</a></div>';
      } else {
        const m = MARKETS[g.market];
        const st = STATUS[goodsStatus(g)];                       // 판매 상태
        document.title = g.name + ' | 소울푸드';

        // 태그
        let tags = '';
        g.tags.forEach(function (t) {
          if (t === 'BOX') return;   // BOX 는 분류용이라 표시하지 않음 (포장 정보는 아래 '포장'에 나와요)
          let cls = 'tag';
          if (t === 'HACCP') cls += ' haccp';
          else if (t !== 'BOX') cls += ' origin';
          tags += '<span class="' + cls + '">' + esc(t) + '</span>';
        });

        // 가격 (data.js 의 SHOW_PRICE 가 true 일 때만 보임)
        let price = '';
        if (SHOW_PRICE && g.price) {   // 가격이 0 이거나 비어 있으면 표시하지 않음
          price = '<div class="price-box"><p class="now">';
          if (g.rate) price += '<em class="rate">' + g.rate + '%</em>';
          price += won(g.price) + '<small>원</small>';
          if (g.was) price += '<del>' + won(g.was) + '원</del>';
          price += '</p>';
          if (g.box && g.boxUnit === '봉') price += '<p class="unit">1봉당 약 ' + won(Math.round(g.price / g.box)) + '원</p>';
          price += '</div>';
        }

        // 상품 정보 줄
        let rows = '';
        if (g.box) rows += '<div><dt>포장</dt><dd>1박스 ' + g.box + (g.boxUnit || '') + (isCold(g) ? ' (아이스박스)' : '') + '</dd></div>';
        if (storageOf(g)) rows += '<div><dt>보관</dt><dd>' + (STORAGE_TEXT[storageOf(g)] || esc(storageOf(g))) + '</dd></div>';

        // 바코드 (관리자 페이지에서 입력한 번호로 그려요)
        let barcode = '';
        if (g.barcode) {
          const svg = barcodeSVG(g.barcode);
          barcode = '<div class="barcode">' + (svg || '<span class="barcode-num">' + esc(g.barcode) + '</span>') + '</div>';
        }

        // 같은 마켓 다른 상품 4개
        const related = m.goods.filter(function (x) { return x.no !== g.no && isListed(x); }).slice(0, 4);

        page.innerHTML =
          '<p class="breadcrumb"><a href="index.html">홈</a> › <a href="catalog.html?market=' + g.market + '">' + m.name + '</a> › <b>' + esc(g.brand || m.name) + '</b></p>' +
          '<section class="detail">' +
            '<div class="photo"><img src="' + imgUrl(g) + '" alt="' + esc(g.name) + '" data-ph="' + m.icon + '" onerror="imgFail(this)">' +
              (st.buy ? '' : '<div class="status-cover ' + st.cls + '"><span>' + st.text + '</span></div>') + '</div>' +
            '<div class="buy">' +
              '<a class="market-link" href="catalog.html?market=' + g.market + '">' + m.icon + ' ' + m.name + ' ›</a>' +
              '<h1>' + (g.brand ? '[' + esc(g.brand) + '] ' : '') + esc(g.name) + '</h1>' +
              '<div class="tags">' + tags + '</div>' +
              (g.desc ? '<p class="desc">' + esc(g.desc) + '</p>' : '') +
              (st.buy ? '' : '<p class="state-note ' + st.cls + '">' + (st.cls === 'restock' ? '🔄 ' : '⛔ ') + st.msg + '</p>') +
              price +
              '<dl class="rows">' + rows + '</dl>' +
              barcode +
              '<div class="actions">' +
                '<span class="btn btn-primary">📞 ' + CONTACT.phones[0] + '</span>' +
                '<span class="btn btn-primary">📱 ' + CONTACT.phones[1] + '</span>' +
                '<span class="btn mail">✉️ 이메일 문의 · ' + CONTACT.email + '</span>' +
              '</div>' +
              '<p class="inquiry-note">거래 조건과 가격은 문의해 주세요. ' + CONTACT.hours + '</p>' +
            '</div>' +
          '</section>' +

          '<section class="tab-panel on" id="tab-info">' +
            '<h4>상품명</h4><p>' + esc(g.name) + '</p>' +
            (g.desc ? '<h4>생산 · 인증 정보</h4><p>' + esc(g.desc) + '</p>' : '') +
            (g.detail ? '<h4>상세 설명</h4><p class="detail-text">' + esc(g.detail) + '</p>' : '') +
            ((g.detail_images || []).length ? '<div class="detail-imgs">' + g.detail_images.map(function (src) {
              return '<img src="' + esc(imgUrl({ img: src })) + '" alt="' + esc(g.name) + ' 상세 이미지" loading="lazy" onerror="this.remove()">';
            }).join('') + '</div>' : '') +
          '</section>' +

          policyHTML() +

        (related.length ?
            '<section class="section"><div class="section-head"><h3>' + m.name + '의 <em>다른 상품</em></h3><a href="catalog.html?market=' + g.market + '">전체보기 ›</a></div>' +
            '<ul class="goods">' + related.map(function (x) { return goodsCardHTML(x); }).join('') + '</ul></section>' : '');
      }
    });
  </script>
</body>
</html>
