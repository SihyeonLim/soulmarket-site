<!DOCTYPE html>
<!--
  ============================================================
  소울푸드 : 회사소개

-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안내 | 소울푸드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="common.css">

  <style>
    .info-tabs { display: flex; gap: 8px; margin: 24px 0; flex-wrap: wrap; }
    .info-tabs a { border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: 14px; }
    .info-tabs a.on { background: var(--text); border-color: var(--text); color: var(--white); }
    .company-hero { background: linear-gradient(120deg, #D7282F, #8E1519); color: var(--white); border-radius: 18px; padding: 56px 48px; }
    .company-hero small { opacity: .8; }
    .company-hero h1 { font-size: 32px; line-height: 1.35; margin-top: 8px; letter-spacing: -1px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
    .facts div { background: var(--bg); border-radius: 14px; padding: 22px; }
    .facts .icon { font-size: 28px; }
    .facts b { display: block; margin: 6px 0 4px; }
    .facts p { font-size: 14px; color: var(--text-sub); }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { border-bottom: 1px solid var(--line); padding: 14px 12px; text-align: left; }
    .table th { width: 160px; background: var(--bg); font-weight: 600; }
    .doc { border: 1px solid var(--line); border-radius: 14px; padding: 28px; min-height: 240px; color: var(--text-sub); }
    @media (max-width: 768px) {
      .facts { grid-template-columns: 1fr; }
      .company-hero { padding: 32px 24px; }
      .company-hero h1 { font-size: 24px; }
      .table th { width: 110px; }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="inner">
    <div id="content"></div>
  </main>

  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="common.js"></script>

            '<div><span class="icon">🏭</span><b>제조</b><p>식자재를 직접 만들고 고릅니다</p></div>' +

</body>
</html>
