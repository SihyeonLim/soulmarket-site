<!DOCTYPE html>
<!--
  ============================================================
  소울푸드 : 회사소개
    info.html  (회사소개)
  ============================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안내 | 소울푸드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="common.css">

  <style>
    .info-tabs { display: flex; gap: 8px; margin: 24px 0; flex-wrap: wrap; }
    .info-tabs a { border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: 14px; }
    .info-tabs a.on { background: var(--text); border-color: var(--text); color: var(--white); }
    .company-hero { background: var(--white); color: var(--text); border: 1px solid var(--line); border-radius: 18px; margin-top: 24px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
    .company-hero .hero-text { padding: 52px 56px; }
    .company-hero .company { font-size: 15px; font-weight: 700; color: var(--brand); }
    .company-hero .lead { margin-top: 14px; font-size: 16px; color: var(--text-sub); }
    .company-hero .brand { background: #FAFAF7; border-left: 1px solid var(--line); display: grid; place-items: center; padding: 32px; }
    .company-hero .brand img { width: 150px; height: auto; }
    /* 함께하는 나눔 (초록우산 어린이재단) */
    .donate { margin: 40px 0 8px; border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px; display: flex; align-items: center; gap: 32px; }
    .donate img { width: 190px; height: auto; flex-shrink: 0; }
    .donate small { font-size: 13px; font-weight: 700; color: #3A8D2E; }
    .donate h3 { font-size: 19px; margin: 4px 0 6px; }
    .donate p { font-size: 14px; color: var(--text-sub); line-height: 1.7; }
    /* 인증 (메인비즈) : 초록우산 칸과 같은 모양 */
    .certs { margin: 16px 0 8px; }
    .cert { border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px; display: flex; align-items: center; gap: 32px; }
    .cert img { width: 190px; height: auto; flex-shrink: 0; }
    .cert small { font-size: 13px; font-weight: 700; color: #1F67B1; }
    .cert h3 { font-size: 19px; margin: 4px 0 6px; }
    .cert p { font-size: 14px; color: var(--text-sub); line-height: 1.6; }
    .company-hero small { opacity: .8; }
    .company-hero h1 { font-size: 32px; line-height: 1.35; margin-top: 12px; letter-spacing: -1px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
    .facts div { background: var(--bg); border-radius: 14px; padding: 22px; }
    .facts .icon { font-size: 28px; }
    .facts b { display: block; margin: 6px 0 4px; }
    .facts p { font-size: 14px; color: var(--text-sub); }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { border-bottom: 1px solid var(--line); padding: 14px 12px; text-align: left; }
    .table th { width: 160px; background: var(--bg); font-weight: 600; }
    #content { word-break: keep-all; }
    .doc { border: 1px solid var(--line); border-radius: 14px; padding: 28px; min-height: 240px; color: var(--text-sub); }
    @media (max-width: 768px) {
      .facts { grid-template-columns: 1fr; }
      .company-hero { grid-template-columns: 1fr; }
      .company-hero .hero-text { padding: 28px 24px; }
      .company-hero .lead { font-size: 14px; }
      .company-hero .brand { border-left: 0; border-top: 1px solid var(--line); padding: 20px; }
      .company-hero .brand img { width: 90px; }
      .donate { flex-direction: column; align-items: flex-start; gap: 16px; padding: 22px; }
      .donate img { width: 160px; }
      .cert p br, .donate p br { display: none; }
      .cert { flex-direction: column; align-items: flex-start; gap: 16px; padding: 22px; }
      .cert img { width: 160px; }
      .company-hero h1 { font-size: 24px; }
      .table th { width: 110px; }
    }
  </style>
</head>

<body>

</body>
