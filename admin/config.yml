# =========================================================
#  소울푸드 관리자 페이지 설정 (Sveltia CMS)
#  - 주소: https://soulmarket.co.kr/admin/
#  - 로그인: "Sign In with Token" + GitHub 토큰 (README.md 참고)
#  - 저장하면 GitHub 저장소에 바로 커밋되고, 1~2분 뒤 사이트에 반영돼요.
# =========================================================
backend:
  name: github
  repo: SihyeonLim/soulmarket-site
  branch: main
  commit_messages:
    create: "관리자: {{collection}} {{slug}} 추가"
    update: "관리자: {{collection}} {{slug}} 수정"
    delete: "관리자: {{collection}} {{slug}} 삭제"
    uploadMedia: "관리자: 사진 업로드 {{path}}"
    deleteMedia: "관리자: 사진 삭제 {{path}}"

site_url: https://soulmarket.co.kr
display_url: https://soulmarket.co.kr

# 업로드한 사진이 저장되는 곳 (사이트에서는 images/goods/파일명 으로 불러와요)
media_folder: images/goods
public_folder: images/goods

collections:
  # ======================================================== 상품 (상품 1개 = 파일 1개)
  - name: goods
    label: 상품
    label_singular: 상품
    description: "오른쪽 위 '새 상품'으로 추가하고, 목록에서 상품을 누르면 수정할 수 있어요. 저장 후 1~2분 뒤 사이트에 반영돼요."
    folder: data/goods
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{no}}"
    identifier_field: name
    summary: "{{no}} · {{name}}"
    thumbnail: img
    sortable_fields: [order, "no", name, market]
    view_groups:
      - { label: 마켓, field: market }
      - { label: 상품 상태, field: status }
    editor:
      preview: false
    fields:
      - name: name
        label: 상품명
        widget: string
      - name: market
        label: 마켓 (어느 카테고리에 넣을지)
        widget: select
        options:
          - { label: "직수입마켓", value: "0001" }
          - { label: "소울마켓", value: "0002" }
          - { label: "까칠한홍여사마켓", value: "0004" }
          - { label: "취화당", value: "0005" }
          - { label: "허브마켓", value: "0003" }
          - { label: "맛깔지기마켓", value: "0006" }
          - { label: "상생마켓", value: "0007" }
          - { label: "B2C마켓", value: "0008" }
      - name: img
        label: 상품 사진 (목록·상세 대표 사진)
        widget: image
        required: false
        choose_url: false
        hint: "정사각형 사진이 가장 잘 보여요. 비워 두면 마켓 아이콘이 대신 보여요."
      - name: "no"
        label: 상품 번호
        widget: number
        value_type: int
        hint: "다른 상품과 겹치지 않는 숫자 (상품 주소에 쓰여요. 예: product.html?no=621). 기존 가장 큰 번호보다 1 큰 수를 쓰면 돼요."
      - name: brand
        label: 브랜드
        widget: string
        required: false
      - name: desc
        label: 한 줄 소개 (생산지 · 인증 등)
        widget: string
        required: false
        hint: "상품명 아래에 작게 보여요. 예: [경상북도 칠곡군] HACCP 인증"
      - name: detail
        label: 상세 설명
        widget: text
        required: false
        hint: "상품 상세 페이지 아래쪽 '상품 정보'에 보여요. 줄바꿈은 그대로 표시돼요."
      - name: detail_images
        label: 상세 이미지
        label_singular: 상세 이미지
        widget: list
        required: false
        field: { name: image, label: 이미지, widget: image, choose_url: false }
        hint: "상세 설명 아래에 순서대로 크게 보여요."
      - name: tags
        label: 태그
        widget: list
        required: false
        hint: "쉼표로 구분 (예: 베트남, HACCP). 'BOX'는 박스 상품 목록 분류용이라 사진에는 표시되지 않아요."
      - name: box
        label: 1박스 입수
        widget: number
        value_type: int
        required: false
        hint: "박스 판매 상품만 입력 (예: 12)"
      - name: boxUnit
        label: 입수 단위
        widget: select
        required: false
        options: ["봉", "박스", "개", "팩", "kg"]
      - name: ice
        label: 아이스박스 포장 (냉동 · 냉장)
        widget: boolean
        required: false
        default: false
      - name: status
        label: 상품 상태
        widget: select
        required: false
        options: ["품절", "재고확보중", "판매중지"]
        hint: "비워 두면 정상. 판매중지는 사이트 목록에서 숨겨져요."
      - name: order
        label: 진열 순서
        widget: number
        value_type: int
        required: false
        default: 0
        hint: "숫자가 작을수록 '랭킹순'에서 앞에 나와요. 같으면 번호가 큰(최근) 상품이 앞이에요."
      - name: price
        label: 가격 (원)
        widget: number
        value_type: int
        required: false
        hint: "'사이트 설정'에서 가격 표시를 켰을 때만 보여요."
      - name: was
        label: 할인 전 가격 (원)
        widget: number
        value_type: int
        required: false
      - name: rate
        label: 할인율 (%)
        widget: number
        value_type: int
        required: false
      - name: sold
        label: 판매량
        widget: number
        value_type: int
        required: false
        hint: "사이트에는 보이지 않고 '베스트' 순서에만 쓰여요."

  # ======================================================== 마켓 · 사이트 설정
  - name: settings
    label: 마켓 · 사이트 설정
    editor:
      preview: false
    files:
      - name: markets
        label: 마켓 (카테고리)
        file: data/markets.json
        format: json
        fields:
          - name: markets
            label: 마켓
            label_singular: 마켓
            widget: list
            summary: "{{fields.code}} · {{fields.name}}"
            hint: "목록 순서가 메뉴 순서예요. 새 마켓을 만들면 상품의 '마켓' 선택지에 나오도록 admin/config.yml 에도 한 줄 추가해야 해요."
            fields:
              - name: code
                label: 마켓 코드
                widget: string
                hint: "겹치지 않는 4자리 숫자 (예: 0009)"
              - name: name
                label: 마켓 이름
                widget: string
              - name: label
                label: 영문 라벨
                widget: string
                required: false
              - name: desc
                label: 설명
                widget: string
                required: false
              - name: colors
                label: 배너 색 (2개)
                widget: list
                min: 2
                max: 2
                field: { name: color, label: 색, widget: color }
              - name: emoji
                label: 배너 큰 그림 (이모지)
                widget: string
                required: false
              - name: icon
                label: 메뉴 아이콘 (이모지)
                widget: string
                required: false
              - name: chips
                label: 목록 위 필터 버튼
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: 버튼 이름, widget: string }
                  - { name: words, label: 찾을 단어, widget: list, hint: "쉼표로 구분. 상품 이름 · 브랜드 · 태그에 하나라도 있으면 보여줘요." }

      - name: site
        label: 사이트 설정
        file: data/site.json
        format: json
        fields:
          - name: show_price
            label: 가격 표시
            widget: boolean
            default: false
            hint: "켜면 상품 카드 · 상세에 가격과 가격순 정렬이 나와요."
